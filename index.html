<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深渊幻境 · 水下漫游</title>
<style>
  :root {
    --ink: #dff7ff;
    --dim: rgba(214, 245, 255, 0.55);
    --cyan: #7fe6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #01070d; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
  }
  #gfx { display: block; width: 100vw; height: 100vh; outline: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(1,6,12,0.34) 100%);
  }

  /* ---------- 加载 ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 110%, rgba(10, 70, 96, 0.55), transparent 62%),
      radial-gradient(ellipse at 50% -10%, rgba(24, 120, 148, 0.5), transparent 58%),
      #020a11;
    transition: opacity 1.1s ease, visibility 1.1s ease;
  }
  #loading.hidden { opacity: 0; visibility: hidden; }
  .brand {
    font-size: clamp(34px, 5.2vw, 64px);
    letter-spacing: 0.34em; text-indent: 0.34em;
    font-weight: 300; color: #eafcff;
    text-shadow: 0 0 26px rgba(110, 226, 255, 0.55), 0 0 90px rgba(40, 160, 200, 0.35);
  }
  .brand-sub {
    margin-top: 12px; font-size: 11px; letter-spacing: 0.52em; text-indent: 0.52em;
    color: var(--dim); text-transform: uppercase;
  }
  .loader-track {
    margin-top: 44px; width: 224px; height: 2px; border-radius: 2px;
    background: rgba(120, 210, 235, 0.16); overflow: hidden;
  }
  #loader-bar {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, rgba(90, 220, 245, 0.2), #8ff0ff);
    box-shadow: 0 0 14px rgba(120, 235, 255, 0.9);
    transition: width 0.45s ease;
  }
  #loader-text { margin-top: 16px; font-size: 12px; letter-spacing: 0.2em; color: var(--dim); }

  /* ---------- 进入提示 ---------- */
  #enter {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(ellipse at 50% 50%, rgba(1, 8, 14, 0.1) 20%, rgba(1, 8, 14, 0.62) 100%);
    opacity: 0; visibility: hidden; transition: opacity 0.7s ease, visibility 0.7s ease;
  }
  #enter.show { opacity: 1; visibility: visible; }
  #enter .ring {
    width: 86px; height: 86px; border-radius: 50%;
    border: 1px solid rgba(140, 235, 255, 0.42);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 36px rgba(80, 220, 250, 0.25), inset 0 0 30px rgba(80, 220, 250, 0.12);
    transition: box-shadow 0.4s ease, border-color 0.4s ease, transform 0.4s ease;
  }
  #enter:hover .ring { box-shadow: 0 0 54px rgba(110, 235, 255, 0.5), inset 0 0 38px rgba(110, 235, 255, 0.2); transform: scale(1.05); }
  #enter .ring::after {
    content: ""; width: 0; height: 0;
    border-left: 15px solid rgba(225, 250, 255, 0.92);
    border-top: 10px solid transparent; border-bottom: 10px solid transparent;
    margin-left: 6px;
  }
  #enter .hint { margin-top: 26px; font-size: 13px; letter-spacing: 0.3em; text-indent: 0.3em; color: rgba(220, 248, 255, 0.8); }
  #enter .sub { margin-top: 10px; font-size: 11px; letter-spacing: 0.12em; color: var(--dim); }

  /* ---------- 界面 HUD ---------- */
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
  #hud.show { opacity: 1; }
  #hud .corner-tl { position: absolute; left: 34px; top: 30px; }
  #hud .title { font-size: 15px; letter-spacing: 0.42em; font-weight: 300; color: rgba(232, 252, 255, 0.92); text-shadow: 0 0 18px rgba(90, 220, 250, 0.7); }
  #hud .subtitle { margin-top: 7px; font-size: 9px; letter-spacing: 0.46em; color: rgba(190, 235, 250, 0.42); text-transform: uppercase; }
  #hud .rule { margin-top: 14px; width: 132px; height: 1px; background: linear-gradient(90deg, rgba(140, 235, 255, 0.55), transparent); }
  #hud .hintbar {
    position: absolute; left: 50%; bottom: 27px; transform: translateX(-50%);
    display: flex; gap: 22px; align-items: center;
    padding: 10px 22px; border-radius: 30px;
    font-size: 11px; letter-spacing: 0.13em; color: rgba(219, 246, 255, 0.66);
    background: rgba(3, 18, 28, 0.34); border: 1px solid rgba(120, 210, 235, 0.12);
    backdrop-filter: blur(7px);
    white-space: nowrap;
  }
  #hud .hintbar b { font-weight: 400; color: rgba(238, 253, 255, 0.92); }
  #hud .perf {
    position: absolute; right: 30px; top: 30px;
    font-size: 10px; letter-spacing: 0.08em; line-height: 1.75; text-align: right;
    color: rgba(190, 240, 255, 0.5); white-space: pre;
    display: none;
  }
  #hud .perf.show { display: block; }
  #hud .est { color: rgba(255, 255, 255, 0.28); }

  /* ---------- 错误 ---------- */
  #err {
    position: fixed; inset: 0; z-index: 40; display: none;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: #02080d; padding: 40px;
  }
  #err.show { display: flex; }
  #err h2 { font-weight: 300; letter-spacing: 0.24em; font-size: 22px; color: #ffb9b9; }
  #err p { max-width: 560px; font-size: 13px; line-height: 2; color: var(--dim); }
  #err code { color: #9fe8ff; font-size: 12px; }
</style>
</head>
<body>
  <canvas id="gfx"></canvas>
  <div class="vignette"></div>

  <div id="loading">
    <div class="brand">深渊幻境</div>
    <div class="brand-sub">Abyssal Bloom</div>
    <div class="loader-track"><div id="loader-bar"></div></div>
    <div id="loader-text">正在生成水下世界…</div>
  </div>

  <div id="enter">
    <div class="ring"></div>
    <div class="hint">点击进入深海</div>
    <div class="sub">鼠标环视 · WASD 游动 · Q / E 升降 · Shift 加速</div>
  </div>

  <div id="hud">
    <div class="corner-tl">
      <div class="title">深渊幻境</div>
      <div class="subtitle">Abyssal Bloom · Procedural Reef</div>
      <div class="rule"></div>
    </div>
    <div class="hintbar">
      <span><b>W A S D</b> 移动</span>
      <span><b>鼠标</b> 环视</span>
      <span><b>Q / E</b> 下降 / 上升</span>
      <span><b>Shift</b> 加速</span>
      <span><b>P</b> 性能</span>
      <span><b>Esc</b> 释放鼠标</span>
    </div>
    <div class="perf" id="perf"></div>
  </div>

  <div id="err">
    <h2>无法启动 WebGPU</h2>
    <p id="err-msg"></p>
  </div>
